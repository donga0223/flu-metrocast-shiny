name: Update Shiny Data

on:
  schedule:
    - cron: "0 15 * * 4"   # every Thursday 15:00 UTC (11:00 AM ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::readr
            any::lubridate
            any::scoringutils
            any::httr
            any::jsonlite

      - name: Create data folder
        run: mkdir -p data

      - name: Run data preparation
        run: Rscript prepare_data.R

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.rds
          git commit -m "Update Shiny data" || echo "No changes to commit"
          git push
